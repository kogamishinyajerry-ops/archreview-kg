# Geometry-decidable rule cards for the MVP.
# Each entry maps 1:1 to archkg.schemas.RuleCard.
# logic_expression must reference only fields listed in `inputs` and use the
# whitelisted operators evaluated by archkg.rules.engine.
- id: RC-CORRIDOR-WIDTH
  source_clause_ids:
    - GB50096-5.7.2
  applies_to: Corridor
  inputs:
    - min_width_m
  logic_expression: "min_width_m >= 1.20"
  output_template: "走廊净宽 {min_width_m:.2f} m，小于规范要求的 1.20 m。"
  test_cases:
    - name: ok_wide
      entity: { min_width_m: 1.50 }
      expect_pass: true
    - name: fail_narrow
      entity: { min_width_m: 1.05 }
      expect_pass: false
    - name: edge_exactly
      entity: { min_width_m: 1.20 }
      expect_pass: true

- id: RC-DOOR-WIDTH
  source_clause_ids:
    - GB50016-5.5.30
  applies_to: Door
  inputs:
    - width_m
  logic_expression: "width_m >= 0.90"
  output_template: "户门净宽 {width_m:.2f} m，小于规范要求的 0.90 m。"
  test_cases:
    - name: ok_standard
      entity: { width_m: 0.90 }
      expect_pass: true
    - name: fail_too_narrow
      entity: { width_m: 0.80 }
      expect_pass: false

# =====================================================================
# Phase 11-B project-level rules — fire & vertical-circulation reminders
# evaluated against ProjectMeta. They emit info-level findings rather than
# error-level violations: the rule engine cannot prove the design has no
# elevator / refuge layer / 防烟楼梯间 from the current entity graph, so
# these surface as "applicable code requirement, manually verify" notes.
# =====================================================================
- id: RC-ELEVATOR-REQUIRED
  source_clause_ids:
    - GB50096-6.4.1
  applies_to: Project
  inputs:
    - floors
    - height_m
  # Pass when neither trigger fires (or both are unset).
  logic_expression: "(floors is None or floors < 7) and (height_m is None or height_m <= 16.0)"
  output_template: "项目 {floors} 层 / 入口距地 {height_m} m，按 GB 50096-6.4.1 必须设置电梯，请确认电梯方案。"
  test_cases:
    - name: low_rise_no_elevator_needed
      entity: { floors: 6, height_m: 14.0 }
      expect_pass: true
    - name: seven_floors_triggers
      entity: { floors: 7, height_m: 18.0 }
      expect_pass: false
    - name: tall_low_floor_count_still_triggers
      entity: { floors: 6, height_m: 17.5 }
      expect_pass: false
    - name: floors_unset_height_below_threshold
      entity: { floors: null, height_m: 12.0 }
      expect_pass: true

- id: RC-EVAC-STAIR-TYPE-33M
  source_clause_ids:
    - GB50016-5.5.27
  applies_to: Project
  inputs:
    - height_m
  logic_expression: "height_m is None or height_m <= 33.0"
  output_template: "项目高度 {height_m} m > 33 m，按 GB 50016-5.5.27 疏散楼梯应采用防烟楼梯间，请确认楼梯间形式。"
  test_cases:
    - name: low_rise_open_stair_ok
      entity: { height_m: 18.0 }
      expect_pass: true
    - name: just_above_threshold_triggers
      entity: { height_m: 35.0 }
      expect_pass: false
    - name: height_unset_passes
      entity: { height_m: null }
      expect_pass: true

- id: RC-CLOSED-STAIRWELL-21M
  source_clause_ids:
    - GB50016-5.5.27
  applies_to: Project
  inputs:
    - height_m
  # Pass when height_m unset, or height ≤21 (敞开 ok), or >33 (caught separately by RC-EVAC-STAIR-TYPE-33M).
  logic_expression: "height_m is None or height_m <= 21.0 or height_m > 33.0"
  output_template: "项目高度 {height_m} m 在 21–33 m 区间，按 GB 50016-5.5.27 疏散楼梯应采用封闭楼梯间，请确认楼梯间形式。"
  test_cases:
    - name: low_rise_open_stair_ok
      entity: { height_m: 18.0 }
      expect_pass: true
    - name: mid_rise_triggers_closed_stair
      entity: { height_m: 25.0 }
      expect_pass: false
    - name: just_above_21_triggers
      entity: { height_m: 22.0 }
      expect_pass: false
    - name: high_rise_handed_off_to_smokeproof_rule
      entity: { height_m: 50.0 }
      expect_pass: true
    - name: height_unset_passes
      entity: { height_m: null }
      expect_pass: true

- id: RC-ACCESSIBLE-RESIDENTIAL-7F
  source_clause_ids:
    - GB50096-6.6.1
  applies_to: Project
  inputs:
    - floors
  # GB50096-6.6.1 says "七层及七层以上" — gates on floor count only, not on
  # the >16m entry-height trigger that drives RC-ELEVATOR-REQUIRED. Codex P1
  # caught: the original copy-paste from the elevator pattern over-fired for
  # 5/6F tall buildings.
  logic_expression: "floors is None or floors < 7"
  output_template: "项目 {floors} 层（≥7 层），按 GB 50096-6.6.1 应对建筑入口、入口平台、候梯厅、公共走道做无障碍设计，请确认。"
  test_cases:
    - name: six_floors_ok
      entity: { floors: 6 }
      expect_pass: true
    - name: seven_floors_triggers
      entity: { floors: 7 }
      expect_pass: false
    - name: floors_unset_passes
      entity: { floors: null }
      expect_pass: true
    # Boundary regression for Codex P11-C nit: explicit ±1 around the 7-floor edge.
    - name: edge_just_below_seven
      entity: { floors: 6 }
      expect_pass: true
    - name: edge_at_seven
      entity: { floors: 7 }
      expect_pass: false

- id: RC-ENTRANCE-PLATFORM-WIDTH-7F
  source_clause_ids:
    - GB50096-6.6.3
  applies_to: Project
  inputs:
    - floors
  # Pass when floors unset OR floors < 7 (低层 / 多层 use 1.50m minimum which is checked at entity level when we have entry-platform entities).
  logic_expression: "floors is None or floors < 7"
  output_template: "项目 {floors} 层（≥7 层），按 GB 50096-6.6.3 入口平台宽度不应小于 2.00 m，请确认入口平台尺寸。"
  test_cases:
    - name: low_rise_no_reminder
      entity: { floors: 6 }
      expect_pass: true
    - name: seven_floors_triggers
      entity: { floors: 7 }
      expect_pass: false
    - name: floors_unset_passes
      entity: { floors: null }
      expect_pass: true

- id: RC-REFUGE-LAYER-100M
  source_clause_ids:
    - GB50016-5.5.31
  applies_to: Project
  inputs:
    - height_m
  logic_expression: "height_m is None or height_m <= 100.0"
  output_template: "项目高度 {height_m} m > 100 m，按 GB 50016-5.5.31 必须设置避难层，请确认避难层方案。"
  test_cases:
    - name: under_100m_no_refuge_layer_needed
      entity: { height_m: 80.0 }
      expect_pass: true
    - name: super_high_rise_triggers
      entity: { height_m: 120.0 }
      expect_pass: false

# =====================================================================
# Phase 11-C Path B (LLM-assisted authoring): Codex-drafted, human-reviewed.
# Drafted by codex-gpt54 from uncovered clauses, validated by Claude
# against the engine semantics, accepted with minor wording tweaks.
# =====================================================================
- id: RC-ELEVATOR-BEDROOM-ADJACENCY
  source_clause_ids:
    - GB50096-6.4.7
    # 6.4.1 supplies the floors/height_m proxy gate (rule fires only when an
    # elevator is in play). Keep both refs so fidelity check can verify
    # the gate numbers come from a real source clause.
    - GB50096-6.4.1
  applies_to: Project
  inputs:
    - floors
    - height_m
  # Mirror the elevator-required gate so this fires whenever an elevator is in play.
  logic_expression: "(floors is None or floors < 7) and (height_m is None or height_m <= 16.0)"
  output_template: "项目 {floors} 层 / 入口距地 {height_m} m，按 GB 50096-6.4.7 电梯不应紧邻卧室布置，请核对电梯井道与卧室的相邻关系。"
  test_cases:
    - name: low_rise_no_elevator_proxy
      entity: { floors: 6, height_m: 14.0 }
      expect_pass: true
    - name: seven_floors_triggers_manual_check
      entity: { floors: 7, height_m: 18.0 }
      expect_pass: false
    - name: tall_low_floor_count_still_triggers
      entity: { floors: 5, height_m: 17.5 }
      expect_pass: false
    - name: floors_unset_height_below_threshold
      entity: { floors: null, height_m: 12.0 }
      expect_pass: true

- id: RC-WHEELCHAIR-PASSAGE-WIDTH-7F
  source_clause_ids:
    - GB50096-6.6.4
    # 6.6.1 supplies the 七层 trigger; without it the fidelity check would
    # rightly flag the rule as drifting from 6.6.4's pure-width content.
    - GB50096-6.6.1
  applies_to: Project
  inputs:
    - floors
  # 6.6.4 itself doesn't carry a 7-floor trigger — it's the accessibility-route
  # width requirement. We surface it as a 7F+ reminder because that is when
  # 6.6.1's accessibility-design obligation kicks in and 6.6.4 becomes operational.
  # Codex P1: drop the >16m trigger; gate on floors only.
  logic_expression: "floors is None or floors < 7"
  output_template: "项目 {floors} 层（≥7 层），按 GB 50096-6.6.4 供轮椅通行的走道和通道净宽不应小于 1.20 m，请确认无障碍通行路径的最窄处宽度。"
  test_cases:
    - name: six_floors_no_trigger
      entity: { floors: 6 }
      expect_pass: true
    - name: seven_floors_triggers
      entity: { floors: 7 }
      expect_pass: false
    - name: floors_unset_passes
      entity: { floors: null }
      expect_pass: true

- id: RC-DOOR-TO-EXIT-40M-LOW-MULTI-AB
  # Branch-specific: covers ONLY the 一级/二级耐火 + 低层/多层 cell of GB 50016 表 5.5.29.
  # Other table branches (三/四级 fire class, 中高层/高层/超高层) have different
  # distance limits and need their own rule cards (Phase 13 RAG candidate).
  # The narrow rule ID makes the partial scope grep-and-see, per Codex P11-C P2.
  source_clause_ids:
    - GB50016-5.5.29
  applies_to: Project
  inputs:
    - fire_class
    - height_class
  # Pass unless the project lands in the 一/二级 + 低层/多层 cell.
  logic_expression: "fire_class is None or (fire_class != '一级' and fire_class != '二级') or (height_class != '低层' and height_class != '多层')"
  output_template: "项目耐火等级 {fire_class} / 高度类别 {height_class}，按 GB 50016 表 5.5.29（一/二级 + 单/多层 分支）位于两个安全出口之间的户门至最近安全出口直线距离不应大于 40 m，请核对疏散距离。注：本规则仅覆盖 一/二级 + 单/多层 分支；其它耐火/高度组合需另行查表。"
  test_cases:
    - name: grade_one_multistory_triggers
      entity: { fire_class: 一级, height_class: 多层 }
      expect_pass: false
    - name: grade_two_low_rise_triggers
      entity: { fire_class: 二级, height_class: 低层 }
      expect_pass: false
    - name: grade_three_multistory_out_of_branch
      entity: { fire_class: 三级, height_class: 多层 }
      expect_pass: true
    - name: grade_one_high_rise_out_of_branch
      entity: { fire_class: 一级, height_class: 高层 }
      expect_pass: true
    - name: fire_class_unset_passes
      entity: { fire_class: null, height_class: 多层 }
      expect_pass: true

- id: RC-BEDROOM-AREA
  source_clause_ids:
    - GB50096-5.3.1
  applies_to: Room
  inputs:
    - area_m2
    - label
  logic_expression: "label != 'bedroom' or area_m2 >= 5.0"
  output_template: "卧室面积 {area_m2:.2f} m²，小于规范要求的 5.0 m²。"
  test_cases:
    - name: ok_single_bedroom
      entity: { label: bedroom, area_m2: 8.0 }
      expect_pass: true
    - name: fail_too_small
      entity: { label: bedroom, area_m2: 4.2 }
      expect_pass: false
    - name: not_a_bedroom_skipped
      entity: { label: bathroom, area_m2: 3.0 }
      expect_pass: true
