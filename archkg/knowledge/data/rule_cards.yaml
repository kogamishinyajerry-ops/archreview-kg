# Geometry-decidable rule cards for the MVP.
# Each entry maps 1:1 to archkg.schemas.RuleCard.
# logic_expression must reference only fields listed in `inputs` and use the
# whitelisted operators evaluated by archkg.rules.engine.
- id: RC-CORRIDOR-WIDTH
  source_clause_ids:
    - GB50096-5.7.2
  applies_to: Corridor
  inputs:
    - min_width_m
  logic_expression: "min_width_m >= 1.20"
  output_template: "走廊净宽 {min_width_m:.2f} m，小于规范要求的 1.20 m。"
  test_cases:
    - name: ok_wide
      entity: { min_width_m: 1.50 }
      expect_pass: true
    - name: fail_narrow
      entity: { min_width_m: 1.05 }
      expect_pass: false
    - name: edge_exactly
      entity: { min_width_m: 1.20 }
      expect_pass: true

- id: RC-DOOR-WIDTH
  source_clause_ids:
    - GB50016-5.5.30
  applies_to: Door
  inputs:
    - width_m
  logic_expression: "width_m >= 0.90"
  output_template: "户门净宽 {width_m:.2f} m，小于规范要求的 0.90 m。"
  test_cases:
    - name: ok_standard
      entity: { width_m: 0.90 }
      expect_pass: true
    - name: fail_too_narrow
      entity: { width_m: 0.80 }
      expect_pass: false

# =====================================================================
# Phase 11-B project-level rules — fire & vertical-circulation reminders
# evaluated against ProjectMeta. They emit info-level findings rather than
# error-level violations: the rule engine cannot prove the design has no
# elevator / refuge layer / 防烟楼梯间 from the current entity graph, so
# these surface as "applicable code requirement, manually verify" notes.
# =====================================================================
- id: RC-ELEVATOR-REQUIRED
  source_clause_ids:
    - GB50096-6.4.1
  applies_to: Project
  inputs:
    - floors
    - height_m
  # Pass when neither trigger fires (or both are unset).
  logic_expression: "(floors is None or floors < 7) and (height_m is None or height_m <= 16.0)"
  output_template: "项目 {floors} 层 / 入口距地 {height_m} m，按 GB 50096-6.4.1 必须设置电梯，请确认电梯方案。"
  test_cases:
    - name: low_rise_no_elevator_needed
      entity: { floors: 6, height_m: 14.0 }
      expect_pass: true
    - name: seven_floors_triggers
      entity: { floors: 7, height_m: 18.0 }
      expect_pass: false
    - name: tall_low_floor_count_still_triggers
      entity: { floors: 6, height_m: 17.5 }
      expect_pass: false
    - name: floors_unset_height_below_threshold
      entity: { floors: null, height_m: 12.0 }
      expect_pass: true

- id: RC-EVAC-STAIR-TYPE-33M
  source_clause_ids:
    - GB50016-5.5.27
  applies_to: Project
  inputs:
    - height_m
  logic_expression: "height_m is None or height_m <= 33.0"
  # Phase 14 audit nit: 5.5.27 §3 carries no 乙级防火门 exemption for the
  # 防烟楼梯间 branch (unlike §1/§2). The reminder stays unconditional for
  # >33m, but it explicitly notes the exemption only applies to the lower
  # bands so reviewers don't try to invoke it here.
  output_template: "项目高度 {height_m} m > 33 m，按 GB 50016-5.5.27 §3 疏散楼梯应采用防烟楼梯间（该分支无乙级防火门豁免），请确认楼梯间形式。"
  test_cases:
    - name: low_rise_open_stair_ok
      entity: { height_m: 18.0 }
      expect_pass: true
    - name: just_above_threshold_triggers
      entity: { height_m: 35.0 }
      expect_pass: false
    - name: height_unset_passes
      entity: { height_m: null }
      expect_pass: true

- id: RC-CLOSED-STAIRWELL-21M
  source_clause_ids:
    - GB50016-5.5.27
  applies_to: Project
  inputs:
    - height_m
  # Pass when height_m unset, or height ≤21 (敞开 ok), or >33 (caught separately by RC-EVAC-STAIR-TYPE-33M).
  logic_expression: "height_m is None or height_m <= 21.0 or height_m > 33.0"
  # Codex Phase 14 P1: 5.5.27 §2 carries an exemption — 当户门采用乙级防火门时
  # 可采用敞开楼梯间. The reminder surfaces the exemption so a compliant design
  # using 乙级防火门 doesn't read as a false violation; the harness can't
  # confirm 乙级防火门 from the entity graph, so the call belongs to the reviewer.
  output_template: "项目高度 {height_m} m 在 21–33 m 区间，按 GB 50016-5.5.27 §2 疏散楼梯应采用封闭楼梯间；如户门采用乙级防火门，可采用敞开楼梯间，请核对楼梯间形式与户门防火等级。"
  test_cases:
    - name: low_rise_open_stair_ok
      entity: { height_m: 18.0 }
      expect_pass: true
    - name: mid_rise_triggers_closed_stair
      entity: { height_m: 25.0 }
      expect_pass: false
    - name: just_above_21_triggers
      entity: { height_m: 22.0 }
      expect_pass: false
    - name: high_rise_handed_off_to_smokeproof_rule
      entity: { height_m: 50.0 }
      expect_pass: true
    - name: height_unset_passes
      entity: { height_m: null }
      expect_pass: true

- id: RC-ACCESSIBLE-RESIDENTIAL-7F
  source_clause_ids:
    - GB50096-6.6.1
  applies_to: Project
  inputs:
    - floors
  # GB50096-6.6.1 says "七层及七层以上" — gates on floor count only, not on
  # the >16m entry-height trigger that drives RC-ELEVATOR-REQUIRED. Codex P1
  # caught: the original copy-paste from the elevator pattern over-fired for
  # 5/6F tall buildings.
  logic_expression: "floors is None or floors < 7"
  output_template: "项目 {floors} 层（≥7 层），按 GB 50096-6.6.1 应对建筑入口、入口平台、候梯厅、公共走道做无障碍设计，请确认。"
  test_cases:
    - name: six_floors_ok
      entity: { floors: 6 }
      expect_pass: true
    - name: seven_floors_triggers
      entity: { floors: 7 }
      expect_pass: false
    - name: floors_unset_passes
      entity: { floors: null }
      expect_pass: true
    # Boundary regression for Codex P11-C nit: explicit ±1 around the 7-floor edge.
    - name: edge_just_below_seven
      entity: { floors: 6 }
      expect_pass: true
    - name: edge_at_seven
      entity: { floors: 7 }
      expect_pass: false

- id: RC-ENTRANCE-PLATFORM-WIDTH-7F
  source_clause_ids:
    - GB50096-6.6.3
  applies_to: Project
  inputs:
    - floors
  # Pass when floors unset OR floors < 7 (低层 / 多层 use 1.50m minimum which is checked at entity level when we have entry-platform entities).
  logic_expression: "floors is None or floors < 7"
  output_template: "项目 {floors} 层（≥7 层），按 GB 50096-6.6.3 入口平台宽度不应小于 2.00 m，请确认入口平台尺寸。"
  test_cases:
    - name: low_rise_no_reminder
      entity: { floors: 6 }
      expect_pass: true
    - name: seven_floors_triggers
      entity: { floors: 7 }
      expect_pass: false
    - name: floors_unset_passes
      entity: { floors: null }
      expect_pass: true

- id: RC-REFUGE-LAYER-100M
  source_clause_ids:
    - GB50016-5.5.31
  applies_to: Project
  inputs:
    - height_m
  logic_expression: "height_m is None or height_m <= 100.0"
  output_template: "项目高度 {height_m} m > 100 m，按 GB 50016-5.5.31 必须设置避难层，请确认避难层方案。"
  test_cases:
    - name: under_100m_no_refuge_layer_needed
