- id: RC-CHILD-RAILING-VERTICAL-SPACING-0.11
  source_clause_ids:
    - GB50352-6.7.4
  applies_to: Project
  inputs:
    - building_type
  # Codex P13-full P2: clause text narrows scope to 住宅/托儿所/幼儿园/中小学
  # — child-oriented occupancies. building_type=public covers libraries, malls,
  # offices etc. that are out of clause scope, so firing on all public projects
  # is over-broad. Restrict the reminder to residential until ProjectMeta gains
  # a use_type taxonomy that can distinguish 托幼/中小学 from generic public.
  logic_expression: "building_type != 'residential'"
  output_template: "项目为住宅，请核对栏杆采用防止攀爬构造，垂直杆件净间距 ≤ 0.11 m（GB 50352-6.7.4，住宅/托幼/中小学等场所）。"
  test_cases:
    - name: residential_triggers_reminder
      entity: { building_type: residential }
      expect_pass: false
    - name: public_passes_until_use_type_gate
      entity: { building_type: public }
      expect_pass: true
    - name: industrial_passes
      entity: { building_type: industrial }
      expect_pass: true

