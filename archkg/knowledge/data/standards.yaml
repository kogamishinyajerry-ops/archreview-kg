# Source: GB 50096-2011《住宅设计规范》+ GB 50016-2014《建筑设计防火规范》— excerpts for ArchReview-KG.
# Each entry maps 1:1 to archkg.schemas.StandardClause.
# Phase 8 metadata: category / applies_to_* / version / supersedes / paraphrase.
