name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dev environment
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check archkg tests

      - name: Mypy
        run: uv run mypy archkg

      - name: Pytest
        run: uv run pytest -q
