[project]
name = "archkg"
version = "1.1.0"
description = "ArchReview-KG: civil-architecture drawing review via entity graph + rule cards"
requires-python = ">=3.11"
authors = [{ name = "Kogami Shinya" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "shapely>=2.0",
    "PyMuPDF>=1.24",
    "Jinja2>=3.1",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
archkg = "archkg.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archkg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"archkg/cli/*.py" = ["B008", "RUF001"]                    # Typer call-in-default + intentional CJK punctuation
"archkg/knowledge/search.py" = ["RUF002", "RUF003"]       # docstring deliberately includes full-width punctuation as examples
"archkg/knowledge/fidelity.py" = ["RUF001", "RUF002", "RUF003"]   # citation regex + docstrings deliberately use full-width / en-dash variants
"archkg/rules/applicability.py" = ["RUF001"]              # user-facing zh-CN messages use full-width parens by convention
"tests/*.py" = ["B008", "RUF001", "RUF002", "RUF003"]     # CJK punctuation + full-width unicode test fixtures

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
